name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '53 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The macOS arm64 image carries Go in the tool cache only, so it is on
      # PATH on ubuntu and windows and absent here until an action places it.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: state
        run: |
          printf 'a hosted runner, %s logical CPUs, %s %s, on mains\n' \
            "$(getconf _NPROCESSORS_ONLN)" "$RUNNER_OS" "$RUNNER_ARCH"
          go version
          go env CGO_ENABLED GOTOOLCHAIN GOFLAGS

      # No go.work here on purpose. The requires in go/go.mod resolve from the
      # module proxy at the versions this repository pins, which is the only
      # route a stranger has. If a pin is older than the API these sources
      # call, this step is where that shows.
      - name: build and test
        working-directory: go
        run: |
          go build ./...
          n=$(go list -f '{{if .TestGoFiles}}x{{end}}' ./... | grep -c x || true)
          if [ "$n" -lt 1 ]; then
            printf 'FAIL  no package in this module has a test file, and go test calls that a pass\n'
            exit 1
          fi
          go test -count=1 ./...
          printf '%s: %s go packages with tests, resolved as an adopter resolves them\n' \
            "$RUNNER_OS" "$n" >> "$GITHUB_STEP_SUMMARY"

      - name: race
        working-directory: go
        run: |
          if [ "$(go env CGO_ENABLED)" != "1" ]; then
            printf 'UNPROVEN  race detector — CGO_ENABLED=0, no C compiler for go env CC=%s\n' "$(go env CC)"
            printf '%s: UNPROVEN race detector, CGO_ENABLED=0\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go test -race -count=1 ./...
          printf '%s: go tests under the race detector\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The python of this layer imports the layers below it by relative path,
      # so the runner is laid out the way a reader lays out clones: this
      # repository beside its siblings, each at its default branch.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: abstraction-model
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: openabstractions/abstraction-download
          path: abstraction-download
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: openabstractions/abstraction-job
          path: abstraction-job
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: openabstractions/abstraction-cas
          path: abstraction-cas
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: openabstractions/abstraction-watch
          path: abstraction-watch

      - name: test
        working-directory: abstraction-model/python
        run: |
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            printf 'UNPROVEN  python on %s — no interpreter on PATH, nothing was run\n' "$RUNNER_OS"
            printf '%s: UNPROVEN python, no interpreter on PATH\n' "$RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$PY" --version
          sep=':'
          [ "$RUNNER_OS" = Windows ] && sep=';'
          export PYTHONPATH="$GITHUB_WORKSPACE/abstraction-download/python${sep}$GITHUB_WORKSPACE/abstraction-job/python${sep}$GITHUB_WORKSPACE/abstraction-cas/python${sep}$GITHUB_WORKSPACE/abstraction-watch/python"
          "$PY" -m unittest discover -p 'test_*.py' 2>&1 | tee out.txt
          if grep -q '^Ran 0 tests' out.txt; then
            printf 'FAIL  discovery found no test to run, and unittest calls that a pass\n'
            exit 1
          fi
          printf '%s: python, %s tests, with download, job, cas and watch beside it\n' \
            "$RUNNER_OS" "$(sed -n 's/^Ran \([0-9]*\) tests\?.*/\1/p' out.txt | tail -1)" >> "$GITHUB_STEP_SUMMARY"

  unproven:
    needs: [go, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: what this workflow did not run
        run: |
          {
            printf '\n### UNPROVEN\n\nThis workflow builds what this repository contains, and nothing else. It ran none of:\n\n'
            printf -- '- the cross-language conformance harnesses, which live in the private tree\n'
            printf -- '- install.ps1 and uninstall.ps1, which change a machine and are not run on a runner\n'
            printf -- '- any real model download or residency measurement; nothing here reaches a network or a GPU\n'
            printf -- '- any signed or installed artefact\n'
            printf -- '- the siblings at any pinned revision. python takes download, job, cas and watch at their default branch, so this is a statement about today.\n'
          } >> "$GITHUB_STEP_SUMMARY"
