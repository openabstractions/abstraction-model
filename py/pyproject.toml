[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction-model-protocol"
version = "0.0.0"
description = "Generated OpenAbstractions model lookup protocol types and service clients"
requires-python = ">=3.10"
dependencies = ["abstraction-download-request-protocol==0.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["abstraction.model*"]
namespaces = true
